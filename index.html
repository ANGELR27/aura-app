<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura — Red Social Privada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], display: ['Outfit','sans-serif'] }}}}
    </script>
    <style>
        *{box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#fce4ec 0%,#f8bbd0 25%,#f3e5f5 50%,#e8eaf6 75%,#e3f2fd 100%);background-attachment:fixed;min-height:100vh;color:#2d1b30}
        .glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 32px rgba(180,120,150,.12),inset 0 1px 0 rgba(255,255,255,.6)}
        .glass-strong{background:rgba(255,255,255,.72);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 40px rgba(180,120,150,.15),inset 0 1px 0 rgba(255,255,255,.7)}
        .glass-dark{background:rgba(255,255,255,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3)}
        .glass-hover:hover{background:rgba(255,255,255,.78);transform:translateY(-2px);box-shadow:0 16px 48px rgba(180,100,140,.2),inset 0 1px 0 rgba(255,255,255,.8)}
        .btn-primary{background:linear-gradient(135deg,#ec407a 0%,#ab47bc 100%);color:#fff;font-weight:600;border:none;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 16px rgba(236,64,122,.35)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(236,64,122,.45)}
        .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .btn-ghost{background:rgba(255,255,255,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);font-weight:500;transition:all .3s ease}
        .btn-ghost:hover{background:rgba(255,255,255,.7);transform:translateY(-1px)}
        .avatar-ring{border:2.5px solid rgba(236,64,122,.4);padding:2px}
        .input-glass{background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border:1.5px solid rgba(200,180,200,.3);transition:all .3s ease}
        .input-glass:focus{background:rgba(255,255,255,.75);border-color:#ec407a;box-shadow:0 0 0 3px rgba(236,64,122,.12);outline:none}
        .cloud-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 10% 20%,rgba(248,187,208,.6) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(179,157,219,.4) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(255,224,178,.3) 0%,transparent 60%);filter:blur(60px)}
        .fade-in{animation:fadeIn .5s ease-out}
        @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .slide-up{animation:slideUp .4s cubic-bezier(.16,1,.3,1)}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
        .spinner{border:3px solid rgba(255,255,255,.3);border-top:3px solid #fff;border-radius:50%;width:16px;height:16px;animation:spin .8s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        .live-dot{width:6px;height:6px;border-radius:50%;background:#4caf50;animation:pulse-live 2s infinite}
        @keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.4}}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(180,140,160,.3);border-radius:10px}
        .toast{position:fixed;top:20px;right:20px;z-index:100;animation:slideIn .4s ease}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    </style>
</head>
<body class="min-h-screen antialiased relative">

    <div id="toastContainer" class="fixed top-4 right-4 z-[100] space-y-2"></div>

    <!-- ========================== LOADING ========================== -->

            <div class="flex items-center bg-black/5 p-1 rounded-2xl">

                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 opacity-40"></i>

                        <div class="text-left">
                            <p class="text-xs font-bold text-purple-600">Ángel</p>
                            <p class="text-[9px] opacity-50">angel@aura.app</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================== MAIN APP ========================== -->
    <div id="mainApp" class="relative z-10 max-w-2xl mx-auto px-4 pt-5 pb-24" style="display:none;">

        <!-- HEADER -->
        <header class="glass-strong rounded-2xl p-3.5 mb-5 flex items-center justify-between fade-in">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-500 via-rose-400 to-purple-500 flex items-center justify-center text-white shadow-md shadow-pink-500/20 font-display font-bold text-base">A</div>
                <div>
                    <h1 class="text-base font-display font-bold tracking-tight flex items-center gap-1.5">
                        Aura
                        <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-gradient-to-r from-pink-100 to-purple-100 text-pink-600 font-mono font-medium">v3.1</span>

                    <div class="flex items-center gap-1.5">

                            <i data-lucide="image-plus" class="w-3.5 h-3.5 text-blue-500"></i> Foto

                        </label>
                    </div>
                    <button onclick="submitPost()" id="publishBtn" class="btn-primary px-4 py-1.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer">

            <!-- Feed -->

            </div>
            <div class="glass rounded-xl p-4 flex items-center gap-3">
                <img id="profileAvatar" src="" class="w-14 h-14 rounded-xl object-cover avatar-ring">

                    <p id="profileEmail" class="text-[11px] opacity-50"></p>

    <script>
    /* ===== SUPABASE CONFIG ===== */
    const SUPABASE_URL = 'https://vrhicfjugclcchvckzkw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyaGljZmp1Z2NsY2NodmNremt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODIxMjEsImV4cCI6MjEwMzM1ODEyMX0.CTjIV7Gpr20u60byAFkH1v9D5onuNVA5pBOyqrfbYMg';

    /* ===== STATE ===== */
    let currentUser = null;
    let allProfiles = {};
    let postPhotoFile = null;

    const VERSES = [
        { text:"Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.", ref:"Filipenses 4:6-7" },
        { text:"Lámpara es a mis pies tu palabra, y lumbrera a mi camino.", ref:"Salmos 119:105" },
        { text:"Todo lo puedo en Cristo que me fortalece.", ref:"Filipenses 4:13" },
        { text:"El amor es sufrido, es benigno; el amor no tiene envidia.", ref:"1 Corintios 13:4" },
        { text:"Confía en el Señor con todo tu corazón, y no te apoyes en tu propia prudencia.", ref:"Proverbios 3:5" },
        { text:"Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz.", ref:"Jeremías 29:11" }
    ];
    let verseIdx = 0;

    /* ===== TOAST ===== */
    function toast(msg, type='info') {
        const colors = { info:'bg-blue-500', success:'bg-emerald-500', error:'bg-rose-500' };
        const el = document.createElement('div');
        el.className = `toast glass-strong rounded-xl px-4 py-2.5 text-xs font-medium flex items-center gap-2 shadow-lg`;
        el.innerHTML = `<span class="w-2 h-2 rounded-full ${colors[type]}"></span>${msg}`;
        document.getElementById('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    /* ===== INIT ===== */
    window.onload = async function() {
        lucide.createIcons();
        const saved = localStorage.getItem('aura_cloud_user');
        if (saved) {
            try {
                currentUser = JSON.parse(saved);
                await loadAllProfiles();
                showApp();
                await loadPosts();
                await loadHabits();
                setupRealtime();
            } catch(e) {
                console.error(e);
                showAuth();
            }
        } else {
            showAuth();
        }
        document.getElementById('loadingScreen').style.display = 'none';
    };

    function showAuth() {
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('loadingScreen').style.display = 'none';
        lucide.createIcons();
    }

    async function showApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        updateHeader();
        setVerseDate();
        renderVerse();
        lucide.createIcons();
    }

    /* ===== AUTH ===== */
    function setAuthMode(mode) {
        const login = document.getElementById('loginForm');
        const reg = document.getElementById('registerForm');
        const tabL = document.getElementById('authTabLogin');
        const tabR = document.getElementById('authTabRegister');
        if (mode === 'login') {
            login.style.display = 'block'; reg.style.display = 'none';
            tabL.className = 'flex-1 py-2 rounded-xl text-xs font-semibold transition-all bg-white shadow-sm text-pink-600';
            tabR.className = 'flex-1 py-2 rounded-xl text-xs font-semibold transition-all opacity-60';
        } else {
            login.style.display = 'none'; reg.style.display = 'block';
            tabR.className = 'flex-1 py-2 rounded-xl text-xs font-semibold transition-all bg-white shadow-sm text-pink-600';
            tabL.className = 'flex-1 py-2 rounded-xl text-xs font-semibold transition-all opacity-60';
        }
        lucide.createIcons();
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pw = document.getElementById('loginPassword').value.trim();
        if (!email) return toast('Ingresa tu correo', 'error');
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verificando...';

        const { data, error } = await sb.from('profiles').select('*').eq('email', email).single();
        if (error || !data) { btn.disabled = false; btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Iniciar Sesión'; lucide.createIcons(); return toast('Cuenta no encontrada', 'error'); }
        if (data.password !== pw) { btn.disabled = false; btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Iniciar Sesión'; lucide.createIcons(); return toast('Contraseña incorrecta', 'error'); }

        currentUser = data;
        localStorage.setItem('aura_cloud_user', JSON.stringify(currentUser));
        await loadAllProfiles();
        showApp();
        await loadPosts();
        await loadHabits();
        setupRealtime();
        toast(`¡Bienvenido/a, ${data.name}!`, 'success');
    }

    async function handleRegister() {
        const name = document.getElementById('registerName').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const pw = document.getElementById('registerPassword').value.trim();
        if (!name || !email) return toast('Completa nombre y correo', 'error');
        if (pw.length < 6) return toast('Mínimo 6 caracteres de contraseña', 'error');
        const btn = document.getElementById('registerBtn');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creando...';

        const avatar = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(name);
        const { data, error } = await sb.from('profiles').insert({ name, email, password: pw, avatar_url: avatar }).select().single();

        if (error) {
            btn.disabled = false; btn.innerHTML = '<i data-lucide="user-plus" class="w-4 h-4"></i> Crear mi Cuenta'; lucide.createIcons();
            if (error.code === '23505') return toast('Este correo ya está registrado', 'error');
            return toast('Error al registrar: ' + error.message, 'error');
        }

        currentUser = data;
        localStorage.setItem('aura_cloud_user', JSON.stringify(currentUser));
        await loadAllProfiles();
        showApp();
        await loadPosts();
        await loadHabits();
        setupRealtime();
        toast(`¡Cuenta creada! Bienvenido/a, ${name}`, 'success');
    }

    async function quickLogin(email, pw) {
        const { data, error } = await sb.from('profiles').select('*').eq('email', email).single();
        if (error || !data) return toast('Perfil no encontrado en la nube. Ejecuta el SQL primero.', 'error');
        if (data.password !== pw) return toast('Contraseña incorrecta', 'error');
        currentUser = data;
        localStorage.setItem('aura_cloud_user', JSON.stringify(currentUser));
        await loadAllProfiles();
        showApp();
        await loadPosts();
        await loadHabits();
        setupRealtime();
        toast(`¡Hola, ${data.name}! 🌸`, 'success');
    }

    function handleLogout() {
        localStorage.removeItem('aura_cloud_user');
        currentUser = null;
        closeProfileMenu();
        showAuth();
    }

    /* ===== PROFILES ===== */
    async function loadAllProfiles() {
        const { data } = await sb.from('profiles').select('*');
        if (data) data.forEach(p => allProfiles[p.id] = p);
    }

    function getProfile(id) {
        return allProfiles[id] || { name: '?', avatar_url: '' };
    }

    function updateHeader() {
        document.getElementById('headerAvatar').src = currentUser.avatar_url;
        document.getElementById('headerName').innerText = currentUser.name;
        document.getElementById('postAvatar').src = currentUser.avatar_url;
        document.getElementById('postAsLabel').innerText = 'Publicando como: ' + currentUser.name;
    }

    function openProfileMenu() {
        document.getElementById('profileAvatar').src = currentUser.avatar_url;
        document.getElementById('profileName').innerText = currentUser.name;
        document.getElementById('profileEmail').innerText = currentUser.email;
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('profileMenuModal').classList.remove('hidden');
        lucide.createIcons();
    }
    function closeProfileMenu() { document.getElementById('profileMenuModal').classList.add('hidden'); }

    async function handleEditAvatar(e) {
        const file = e.target.files[0]; if (!file) return;
        toast('Subiendo foto...', 'info');
        const path = `avatars/${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
        const { error } = await sb.storage.from('photos').upload(path, file);
        if (error) return toast('Error al subir foto', 'error');
        const { data: urlData } = sb.storage.from('photos').getPublicUrl(path);
        currentUser.avatar_url = urlData.publicUrl;
        document.getElementById('profileAvatar').src = currentUser.avatar_url;
        toast('Foto actualizada', 'success');
    }

    async function saveProfile() {
        const name = document.getElementById('editName').value.trim();
        if (name) currentUser.name = name;
        const { error } = await sb.from('profiles').update({ name: currentUser.name, avatar_url: currentUser.avatar_url }).eq('id', currentUser.id);
        if (error) return toast('Error al guardar', 'error');
        localStorage.setItem('aura_cloud_user', JSON.stringify(currentUser));
        allProfiles[currentUser.id] = currentUser;
        updateHeader();
        closeProfileMenu();
        toast('Perfil actualizado ✨', 'success');
    }

    /* ===== TABS ===== */
    function switchTab(tab) {
        document.getElementById('viewFeed').classList.toggle('hidden', tab !== 'feed');
        document.getElementById('viewHabits').classList.toggle('hidden', tab !== 'habits');
        document.getElementById('tabFeed').className = 'tab-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ' + (tab === 'feed' ? 'bg-white shadow-sm' : 'opacity-60 hover:opacity-90');
        document.getElementById('tabHabits').className = 'tab-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ' + (tab === 'habits' ? 'bg-white shadow-sm' : 'opacity-60 hover:opacity-90');
        if (tab === 'habits') loadHabits();
        lucide.createIcons();
    }

    /* ===== VERSE ===== */
    function setVerseDate() {
        const d = new Date();
        const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        document.getElementById('verseDate').innerText = `${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]}`;
    }
    function renderVerse() {
        const v = VERSES[verseIdx];
        document.getElementById('verseText').innerText = '"' + v.text + '"';
        document.getElementById('verseRef').innerText = '— ' + v.ref;
    }
    function shuffleVerse() { verseIdx = (verseIdx + 1) % VERSES.length; renderVerse(); }

    /* ===== POSTS ===== */
    function handlePostPhoto(e) {
        const f = e.target.files[0]; if (!f) return;
        postPhotoFile = f;
        const r = new FileReader();
        r.onload = ev => { document.getElementById('postPhotoImg').src = ev.target.result; document.getElementById('postPhotoPreview').classList.remove('hidden'); };
        r.readAsDataURL(f);
    }
    function removePostPhoto() { postPhotoFile = null; document.getElementById('postPhotoPreview').classList.add('hidden'); document.getElementById('postPhotoInput').value = ''; }

    async function submitPost() {
        const text = document.getElementById('postInput').value.trim();
        if (!text && !postPhotoFile) return;
        const btn = document.getElementById('publishBtn');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Publicando...';

        let photoUrl = null;
        if (postPhotoFile) {
            const path = `posts/${currentUser.id}_${Date.now()}.${postPhotoFile.name.split('.').pop()}`;
            const { error } = await sb.storage.from('photos').upload(path, postPhotoFile);
            if (!error) {
                const { data: urlData } = sb.storage.from('photos').getPublicUrl(path);
                photoUrl = urlData.publicUrl;
            }
        }

        const { error } = await sb.from('posts').insert({
            user_id: currentUser.id,
            text: text || '📸 Compartió una foto',
            photo_url: photoUrl,
            reactions: {}
        });

        btn.disabled = false; btn.innerHTML = '<i data-lucide="send-horizontal" class="w-3.5 h-3.5"></i> Publicar'; lucide.createIcons();
        if (error) return toast('Error al publicar: ' + error.message, 'error');

        document.getElementById('postInput').value = '';
        removePostPhoto();
        await loadPosts();
        toast('¡Publicado! 🎉', 'success');
    }

    async function loadPosts() {
        const { data: posts, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
        if (error) { console.error(error); return; }

        const postIds = posts.map(p => p.id);
        let comments = [];
        if (postIds.length > 0) {
            const { data: c } = await sb.from('comments').select('*').in('post_id', postIds).order('created_at', { ascending: true });
            if (c) comments = c;
        }

        renderFeed(posts, comments);
    }

    function renderFeed(posts, comments) {
        const list = document.getElementById('feedList'); list.innerHTML = '';
        if (posts.length === 0) {
            list.innerHTML = '<div class="text-center py-12 glass rounded-2xl"><p class="text-xs opacity-40">Aún no hay publicaciones. ¡Sé el primero!</p></div>';
            return;
        }

        posts.forEach(post => {
            const author = getProfile(post.user_id);
            const postComments = comments.filter(c => c.post_id === post.id);
            const isOwner = post.user_id === currentUser.id;
            const timeAgo = formatTime(post.created_at);
            const reactions = post.reactions || {};

            let commentsHtml = postComments.map(c => {
                const cp = getProfile(c.user_id);
                return `<div class="flex items-start gap-2 p-2 rounded-lg glass-dark">
                    <img src="${cp.avatar_url}" class="w-5 h-5 rounded-md object-cover mt-0.5">
                    <div class="flex-1">
                        <div class="flex items-center justify-between"><span class="text-[10px] font-bold">${cp.name}</span><span class="text-[8px] opacity-40">${formatTime(c.created_at)}</span></div>
                        <p class="text-[11px] opacity-85 mt-0.5">${c.text}</p>
                    </div>
                </div>`;
            }).join('');

            const card = document.createElement('article');
            card.className = 'glass-strong glass-hover rounded-2xl p-5 transition-all space-y-3 fade-in cursor-default';
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <img src="${author.avatar_url}" class="w-8 h-8 rounded-xl object-cover avatar-ring">
                        <div>
                            <h4 class="text-xs font-bold ${isOwner ? 'text-pink-600' : 'text-purple-600'}">${author.name}</h4>
                            <p class="text-[9px] opacity-40">${timeAgo}</p>
                        </div>
                    </div>
                    <span class="text-[9px] px-2 py-0.5 rounded-full glass font-medium opacity-60">💡 Dato</span>
                </div>
                <p class="text-xs leading-relaxed opacity-85">${post.text}</p>
                ${post.photo_url ? `<div class="rounded-xl overflow-hidden max-h-56"><img src="${post.photo_url}" class="w-full h-auto object-cover rounded-xl"></div>` : ''}
                <div class="flex items-center justify-between pt-2.5 border-t border-black/5 text-xs">
                    <div class="flex items-center gap-1">
                        <button onclick="react('${post.id}','❤️')" class="glass px-2 py-1 rounded-lg hover:bg-white/60 transition-all cursor-pointer text-[11px]">❤️ ${reactions['❤️']||0}</button>
                        <button onclick="react('${post.id}','💡')" class="glass px-2 py-1 rounded-lg hover:bg-white/60 transition-all cursor-pointer text-[11px]">💡 ${reactions['💡']||0}</button>
                        <button onclick="react('${post.id}','🙌')" class="glass px-2 py-1 rounded-lg hover:bg-white/60 transition-all cursor-pointer text-[11px]">🙌 ${reactions['🙌']||0}</button>
                        <button onclick="toggleComments('${post.id}')" class="glass px-2 py-1 rounded-lg hover:bg-white/60 transition-all cursor-pointer text-[11px] flex items-center gap-1"><i data-lucide="message-circle" class="w-3 h-3"></i>${postComments.length}</button>
                    </div>
                </div>
                <div id="comments_${post.id}" class="hidden pt-2 border-t border-black/5 space-y-2">
                    <div class="space-y-1.5 max-h-40 overflow-y-auto">${commentsHtml || '<p class="text-[10px] opacity-40 py-1">Aún no hay comentarios</p>'}</div>
                    <div class="flex gap-2">
                        <input type="text" id="ci_${post.id}" placeholder="Escribe un comentario..." class="input-glass flex-1 px-3 py-1.5 rounded-lg text-[11px]" onkeypress="if(event.key==='Enter')postComment('${post.id}')">
                        <button onclick="postComment('${post.id}')" class="btn-primary px-3 py-1.5 rounded-lg text-[11px] cursor-pointer">Enviar</button>
                    </div>
                </div>`;
            list.appendChild(card);
        });
        lucide.createIcons();
    }

    async function react(postId, emoji) {
        const { data: post } = await sb.from('posts').select('reactions').eq('id', postId).single();
        if (!post) return;
        const r = post.reactions || {};
        r[emoji] = (r[emoji] || 0) + 1;
        await sb.from('posts').update({ reactions: r }).eq('id', postId);
        await loadPosts();
    }

    function toggleComments(id) { document.getElementById('comments_' + id)?.classList.toggle('hidden'); }

    async function postComment(postId) {
        const input = document.getElementById('ci_' + postId);
        const text = input.value.trim(); if (!text) return;
        const { error } = await sb.from('comments').insert({ post_id: postId, user_id: currentUser.id, text });
        if (error) return toast('Error al comentar', 'error');
        input.value = '';
        await loadPosts();
    }

    /* ===== HABITS ===== */
    async function loadHabits() {
        const { data } = await sb.from('habits').select('*').order('created_at', { ascending: true });
        if (!data) return;
        renderHabits(data);
    }

    function renderHabits(habits) {
        const c = document.getElementById('habitsContainer'); c.innerHTML = '';
        const profiles = Object.values(allProfiles);

        profiles.forEach(p => {
            const list = habits.filter(h => h.user_id === p.id);
            if (list.length === 0 && p.id !== currentUser.id) return;
            const done = list.filter(h => h.is_done).length;
            const pct = list.length ? Math.round(done / list.length * 100) : 0;
            const isMe = p.id === currentUser.id;

            const col = document.createElement('div');
            col.className = 'glass rounded-xl p-4 space-y-2.5';
            col.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2"><img src="${p.avatar_url}" class="w-5 h-5 rounded-md object-cover"><span class="text-xs font-bold">${p.name}</span></div>
                    <span class="text-[11px] font-mono font-bold ${pct >= 50 ? 'text-emerald-600' : 'text-pink-600'}">${done}/${list.length} (${pct}%)</span>
                </div>
                ${list.map(h => `
                    <div class="flex items-center justify-between p-2 rounded-lg glass-dark">
                        <label class="flex items-center gap-2 text-[11px] font-medium cursor-pointer flex-1">
                            <input type="checkbox" ${h.is_done ? 'checked' : ''} onchange="toggleHabit('${h.id}',this.checked)" class="w-3.5 h-3.5 rounded accent-pink-500" ${!isMe ? 'disabled' : ''}>
                            <span class="${h.is_done ? 'line-through opacity-40' : ''}">${h.text}</span>
                        </label>
                        ${isMe ? `<button onclick="deleteHabit('${h.id}')" class="opacity-30 hover:opacity-80 p-1 cursor-pointer"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}
                    </div>
                `).join('')}`;
            c.appendChild(col);
        });
        lucide.createIcons();
    }

    async function toggleHabit(id, done) {
        await sb.from('habits').update({ is_done: done }).eq('id', id);
        await loadHabits();
    }

    async function deleteHabit(id) {
        await sb.from('habits').delete().eq('id', id);
        await loadHabits();
    }

    async function addHabit() {
        const text = prompt('Nueva meta:');
        if (!text) return;
        await sb.from('habits').insert({ user_id: currentUser.id, text, is_done: false });
        await loadHabits();
        toast('Meta agregada ✨', 'success');
    }

    /* ===== REALTIME ===== */
    function setupRealtime() {
        sb.channel('aura-live')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, payload => {
                if (payload.new && payload.new.user_id !== currentUser.id) {
                    const author = getProfile(payload.new.user_id);
                    toast(`${author.name} publicó algo nuevo 🌸`, 'info');
                }
                loadPosts();
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, payload => {
                if (payload.new && payload.new.user_id !== currentUser.id) {
                    const author = getProfile(payload.new.user_id);
                    toast(`${author.name} comentó 💬`, 'info');
                }
                loadPosts();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'habits' }, () => {
                loadHabits();
            })
            .subscribe();
    }

    /* ===== UTILS ===== */
    function formatTime(iso) {
        const d = new Date(iso);
        const now = new Date();
        const diff = (now - d) / 1000;
        if (diff < 60) return 'Ahora';
        if (diff < 3600) return `Hace ${Math.floor(diff/60)} min`;
        if (diff < 86400) return `Hace ${Math.floor(diff/3600)}h`;
        if (diff < 172800) return 'Ayer';
        return d.toLocaleDateString('es-MX', { day:'numeric', month:'short' });
    }
    </script>
</body>
</html>
